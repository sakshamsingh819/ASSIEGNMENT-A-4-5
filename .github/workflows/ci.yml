name: CI Build-Failure Prediction Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        python -m unittest discover tests

    - name: Verify Model Training Pipeline
      run: |
        python src/train.py

    - name: Generate Evaluation Visualizations
      run: |
        python src/evaluate.py

    - name: Run Pre-Commit Build Risk Inference Demo
      run: |
        python src/predict.py --demo

